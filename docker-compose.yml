version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: messaging_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-messaging_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./messaging-backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    networks:
      - messaging_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  messaging_network:
    driver: bridge
