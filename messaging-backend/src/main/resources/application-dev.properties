# Dev Environment Configuration (Embedded H2 Database)
spring.application.name=messaging-app
server.port=8080
server.servlet.context-path=/api
management.endpoints.web.exposure.include=health,info

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/messaging_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=MySecureJWTSecretKeyForMessagingApplicationPleaseChangeInProduction!@#$%
app.jwt.expiration=3600000
app.jwt.refresh-expiration=2592000000

# File Storage
app.file.upload-dir=./volume/uploads
app.file.max-file-size=52428800
app.file.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,txt,mp4,avi,mov,3gp,m4a,wav,mp3

# Multipart upload limits (see application.properties for details)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CORS Configuration
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
