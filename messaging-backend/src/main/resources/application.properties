# Application Properties
spring.application.name=messaging-app
# server.port=8080
server.port=${PORT:8080}
server.servlet.context-path=/api
management.endpoints.web.exposure.include=health,info

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messaging_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Connection Pool
# spring.datasource.hikari.maximum-pool-size=20
# spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JWT Configuration
# app.jwt.secret=MySecureJWTSecretKeyForMessagingApplicationPleaseChangeInProduction!@#$%
# app.jwt.expiration=3600000
# app.jwt.refresh-expiration=2592000000
app.jwt.secret=${JWT_SECRET:MySecureJWTSecretKeyForMessagingApplicationPleaseChangeInProduction!@#$%}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# File Storage
app.file.upload-dir=./volume/uploads
app.file.max-file-size=52428800
app.file.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,txt,mp4,avi,mov,3gp,m4a,wav,mp3

# Multipart upload limits - Spring Boot defaults to 1MB/10MB, which silently rejected any
# attachment (photo/video/document) bigger than 1MB even though app.file.max-file-size above
# suggested a much larger 50MB limit was intended. These are the properties Spring actually
# reads for MultipartFile uploads.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Firebase Configuration
firebase.config-path=/your-firebase-config.json
firebase.database-url=https://your-project.firebaseio.com

# Logging
logging.level.root=INFO
logging.level.com.messaging=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8081
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# WebSocket / Tomcat Configuration
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=200
server.tomcat.ws.max-connections=200