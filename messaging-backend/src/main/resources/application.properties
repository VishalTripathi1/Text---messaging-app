# Application Properties
spring.application.name=messaging-app
# server.port=8080
server.port=${PORT:8080}
server.servlet.context-path=/api
management.endpoints.web.exposure.include=health,info

# Lazy initialization is deliberately OFF.
#
# It looks like a startup optimisation and is the opposite of one here. It does not reduce the work
# of creating beans, it defers each one to the first request that needs it - so the JVM reports
# "Started MessagingApplication" quickly while the real cost is paid, invisibly, by whichever
# request arrives first. On a cold Render instance that request is the user's first tap: it waited
# through JPA/Hibernate metadata, Spring Security, and the entity manager, then timed out, and the
# app looked dead. Worse, it defeated the keep-warm ping - the ping completed as soon as the health
# endpoint's own small dependency graph was up, leaving every other bean uninitialised, so the
# instance was "warm" by Render's measure and still cold for anything the app actually does.
#
# With this off, boot does all of that work up front where the keep-warm ping absorbs it, and a
# request to a running instance is fast because there is nothing left to initialise.
spring.main.lazy-initialization=false

# Build the dispatcher servlet during startup rather than on the first HTTP request, for the same
# reason: the alternative is charging one unlucky user for it.
spring.mvc.servlet.load-on-startup=1

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messaging_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JWT Configuration
#
# The refresh token MUST outlive the access token by a wide margin. Both of these used to be
# 2592000000 (30 days), and because a login issues the pair together they expired at the same
# instant - so the credential whose only job is to renew the access token was always already dead
# by the time it was needed. The visible symptom was an app that had to be logged into again after
# sitting idle, since every recovery path (JwtAuthenticationFilter -> 401 -> TokenAuthenticator, and
# the WebSocket handshake's own 401/403 refresh in WebSocketClient) correctly asked for a refresh
# and correctly got told the refresh token was expired too.
#
# 24 hours / 90 days. refreshToken() in AuthServiceImpl rotates the refresh token and starts the
# session's clock again from the new one, so the 90 days is a sliding window rather than a deadline:
# opening the app at all renews it. The access token is short enough that the refresh path runs
# about daily for an active user, which matters - a refresh path exercised once a month is a refresh
# path whose breakage is discovered by users rather than by us.
app.jwt.secret=${JWT_SECRET:MySecureJWTSecretKeyForMessagingApplicationPleaseChangeInProduction!@#$%}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:7776000000}

# File Storage
app.file.upload-dir=./volume/uploads
app.file.max-file-size=52428800
app.file.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,txt,mp4,avi,mov,3gp,m4a,wav,mp3

# Multipart upload limits - Spring Boot defaults to 1MB/10MB, which silently rejected any
# attachment (photo/video/document) bigger than 1MB even though app.file.max-file-size above
# suggested a much larger 50MB limit was intended. These are the properties Spring actually
# reads for MultipartFile uploads.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Firebase Configuration
firebase.config-path=/your-firebase-config.json
firebase.database-url=https://your-project.firebaseio.com

# Logging
logging.level.root=INFO
logging.level.com.messaging=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Also log to a file. The console pattern above drops the level and logger name, so a 500 is
# easy to miss when scrolling, and console output vanishes with the terminal. Relative to the
# process working directory, which is messaging-backend/ for `mvn spring-boot:run`, and already
# covered by .gitignore. The file keeps the level and logger that the console pattern omits.
logging.file.name=logs/backend.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8081
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# WebSocket / Tomcat Configuration
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=200
server.tomcat.ws.max-connections=200