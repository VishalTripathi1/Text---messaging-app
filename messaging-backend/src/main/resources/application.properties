# Application Properties
spring.application.name=messaging-app
server.port=8080
server.servlet.context-path=/api
management.endpoints.web.exposure.include=health,info

# Database Configuration
# spring.datasource.url=jdbc:postgresql://localhost:5432/messaging_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres123
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JWT Configuration
# app.jwt.secret=MySecureJWTSecretKeyForMessagingApplicationPleaseChangeInProduction!@#$%
# app.jwt.expiration=3600000
# app.jwt.refresh-expiration=2592000000
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# File Storage
app.file.upload-dir=./volume/uploads
app.file.max-file-size=52428800
app.file.allowed-extensions=jpg,jpeg,png,gif,pdf,doc,docx,txt,mp4,avi,mov,3gp,m4a,wav,mp3

# Firebase Configuration
firebase.config-path=/your-firebase-config.json
firebase.database-url=https://your-project.firebaseio.com

# Logging
logging.level.root=INFO
logging.level.com.messaging=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:8081
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# WebSocket Configuration
server.tomcat.ws.max-connections=10000
