# Backstop only. The primary keep-warm is an external uptime pinger (cron-job.org / UptimeRobot),
# because GitHub's scheduler will not do this job - see below.
#
# Render stops a free web service after roughly 15 minutes with no inbound requests, and this
# container is deliberately memory-starved to fit 512 MB (see messaging-backend/Dockerfile), so a
# cold boot takes about 180 seconds: one measured run reached "Started MessagingApplication in 142.9
# seconds" and then spent a further 22 seconds before writing its first response.
#
# Why this workflow is not the mechanism, measured rather than assumed. `gh run list` for it showed
# run ages of 9 min, 53 min, 1 h, 2 h, 3 h, 4 h, 6 h, 7 h, 7 h, 8 h - the cron below says every 12
# minutes, and GitHub was dispatching it about once an hour, silently dropping the rest. GitHub
# documents scheduled runs as best-effort and deprioritises frequent schedules on low-traffic repos.
# An hourly ping against a 15-minute idle timeout keeps nothing warm, and the elapsed column proved
# it: nearly every run took ~3 minutes, i.e. every ping was itself sitting through a full cold boot,
# because the instance had already been stopped before the ping arrived. The only fast run (6 s)
# happened to land while the app was in use. So this cost instance-hours and delivered a cold boot
# an hour, which is worse than nothing.
#
# Other limits, worth stating rather than discovering later:
#   * GitHub disables scheduled workflows in a repository with no commits for 60 days. It emails
#     first, and the "Enable workflow" button in the Actions tab brings it back.
#   * Runs of ~3 minutes every 12 minutes would exceed the 2000 free Actions minutes/month on a
#     private repository. Disable this workflow once the external pinger is confirmed working.
#   * Keeping the instance up around the clock uses close to the whole 750 instance-hours/month
#     Render allowance (a month is ~730 hours). Pinging only during waking hours leaves headroom.
#
# Runs can be disabled from the Actions tab (needed to reproduce a cold start on purpose) and
# triggered by hand with workflow_dispatch.

name: Keep backend warm

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

# Never let a slow cold-boot run overlap the next scheduled one.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping health endpoint
        run: |
          # /api/v1/health is public (SecurityConfig permits it unauthenticated), so no secret is
          # needed. -m 240 covers the ~180s cold boot with room to spare; it was 120, which is less
          # than the boot itself, so a cold instance always failed the first attempt and only
          # succeeded on the retry below - which is why runs logged ~3 minutes and still passed.
          curl --silent --show-error --fail \
               --max-time 240 \
               --retry 2 --retry-delay 15 --retry-all-errors \
               --write-out 'http=%{http_code} connect=%{time_connect}s first_byte=%{time_starttransfer}s total=%{time_total}s\n' \
               --output /dev/null \
               https://messaging-backend-cyqt.onrender.com/api/v1/health
