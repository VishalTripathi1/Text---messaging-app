# Keeps the Render free-tier backend from spinning down.
#
# Render stops a free web service after roughly 15 minutes with no inbound requests, and this
# container is deliberately memory-starved to fit 512 MB (see messaging-backend/Dockerfile:
# -Xmx192m, CICompilerCount=2), so a cold boot takes most of a minute. That is why the app used to
# look permanently disconnected until the user logged in again.
#
# Known limits, worth stating rather than discovering later:
#   * GitHub disables scheduled workflows in a repository with no commits for 60 days. It emails
#     first, and the "Enable workflow" button in the Actions tab brings it back.
#   * Scheduled runs are best-effort. Under load GitHub delays cron by 10+ minutes, which is why the
#     interval is 12 minutes rather than 14 - a single skipped run should still land inside the
#     window.
#   * A ping every 12 minutes keeps the instance up ~24/7, which uses close to the whole 750
#     instance-hours/month free allowance (a month is ~730 hours). There is no room left for a
#     second free web service on the same account.
#   * This makes cold starts rare, not impossible. The client-side recovery it accompanies still
#     matters - a missed run, a deploy, or a Render restart all produce one.
#
# Runs can be disabled from the Actions tab (needed to reproduce a cold start on purpose) and
# triggered by hand with workflow_dispatch.

name: Keep backend warm

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

# Never let a slow cold-boot run overlap the next scheduled one.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          # /api/v1/health is public (SecurityConfig permits it unauthenticated), so no secret is
          # needed. -m 120 because the first request after a spin-down waits out the JVM boot;
          # --retry covers the case where Render's edge answers 502 while the origin is still coming
          # up.
          curl --silent --show-error --fail \
               --max-time 120 \
               --retry 2 --retry-delay 15 --retry-all-errors \
               --write-out 'http=%{http_code} connect=%{time_connect}s first_byte=%{time_starttransfer}s total=%{time_total}s\n' \
               --output /dev/null \
               https://messaging-backend-cyqt.onrender.com/api/v1/health
